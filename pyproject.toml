[build-system]
requires = ["setuptools>=83", "wheel>=0.47"]
build-backend = "setuptools.build_meta"

[project]
name = "aiosecspy"
version = "0.1.0"
description = "Async Python client for Ben Software SecuritySpy (v5/v6)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "David Newhall II" }]
keywords = ["securityspy", "homeassistant", "aiohttp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Home Automation",
  "Typing :: Typed",
]
dependencies = [
  "aiohttp>=3.14.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.16.1",
  "build>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/TwitchCaptain/aiosecspy"
Documentation = "https://github.com/TwitchCaptain/aiosecspy#readme"
Issues = "https://github.com/TwitchCaptain/aiosecspy/issues"
Changelog = "https://github.com/TwitchCaptain/aiosecspy/releases"

[tool.setuptools.packages.find]
include = ["aiosecspy*"]

[tool.setuptools.package-data]
aiosecspy = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
