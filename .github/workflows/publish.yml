# Publish aiosecspy to PyPI via Trusted Publishing (OIDC).
# Matches the pending publisher configured on PyPI:
#   Repository: TwitchCaptain/aiosecspy
#   Workflow:   publish.yml
#   Environment: pypi
#
# Trigger: create a GitHub Release (tag like v0.1.0). The package version in
# pyproject.toml must match the release (without the leading "v").

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aiosecspy
    permissions:
      id-token: write # required for Trusted Publishing
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
