# Publish aiosecspy to PyPI via Trusted Publishing (OIDC).
# Matches the pending publisher configured on PyPI:
#   Repository: TwitchCaptain/aiosecspy
#   Workflow:   publish.yml
#   Environment: pypi
#
# Trigger: create a GitHub Release (tag like v0.1.0). The version in
# aiosecspy/__init__.py must match the release tag (without the leading "v").

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Verify the package version matches the release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' aiosecspy/__init__.py)"
          if [ "${RELEASE_TAG#v}" != "$package_version" ]; then
            echo "Release tag ${RELEASE_TAG} does not match version ${package_version}." >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata
        run: twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aiosecspy
    permissions:
      id-token: write # required for Trusted Publishing and attestations
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          print-hash: true
